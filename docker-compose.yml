version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gridfault-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gridfault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridfault-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gridfault
      PORT: "3001"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npx tsx src/server.ts"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridfault-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data:
