services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gridfault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The healthcheck lets dependent services wait until postgres is actually
    # accepting connections, not just the moment the process starts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/gridfault
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    # Run prisma db push before starting the server.
    # db push applies the schema to the database without generating a migration
    # file, which is fine for a dev environment where we're still changing the schema.
    # --accept-data-loss allows destructive changes (drop columns etc.) without
    # prompting, since we want this to run unattended.
    command: >
      sh -c "npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npx tsx src/server.ts"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
